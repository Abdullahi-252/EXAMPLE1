<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let guess = Number(prompt("Guess a number:"))
        let attempts = 1

        while (guess !== 7) {
            if (guess > 7) {
                console.log("too high")
            } else {
                console.log("too low");

            }
            attempts++
            guess = Number(prompt("guess again"))
        }
        console.log("correct gues!");
        console.log(`You made ${attempts} attempts.`);


    </script>
</body>

</html>
